version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: pixelit-postgres
    environment:
      POSTGRES_USER: jorda
      POSTGRES_PASSWORD: Troublemaker99
      POSTGRES_DB: pixelit
      POSTGRES_INITDB_ARGS: "-c timezone=UTC"
    ports:
      - "5432:5432"  # Host:Container - access from localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persists database data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixelit-network

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: pixelit-redis
    ports:
      - "6379:6379"  # Host:Container - access from localhost:6379
    volumes:
      - redis_data:/data  # Persists Redis data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pixelit-network

  # Node.js Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixelit-backend

    # Load DATABASE_URL + secrets from .env
    env_file:
      - .env

    # (Optional) keep only non-secret overrides here if you want
    environment:
      NODE_ENV: development
      PORT: 12000

    ports:
      - "12000:12000"  # Host:Container - access from localhost:12000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "rm -rf /app/node_modules/* /app/node_modules/.[!.]* /app/node_modules/..?* 2>/dev/null || true && npm ci && npx prisma generate && npm run start:dev"
    networks:
      - pixelit-network
    restart: unless-stopped

# Named volumes for persistent data storage
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  node_modules:
    driver: local

# Custom network for service communication
networks:
  pixelit-network:
    driver: bridge
